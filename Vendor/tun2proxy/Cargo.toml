[package]
name = "tun2proxy"
version = "0.8.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/tun2proxy/tun2proxy"
homepage = "https://github.com/tun2proxy/tun2proxy"
authors = ["B. Blechschmidt", "ssrlive"]
description = "Tunnel interface to proxy"
readme = "README.md"
rust-version = "1.85"

[dependencies]
async-trait = "0.1.91"
hickory-proto = "0.26.1"
ipstack = { version = "1.0.1", path = "ipstack" }
log = { version = "0.4.33", features = ["std"] }
percent-encoding = "2.3.2"
socks5-impl = { version = "0.9.4", default-features = false }
thiserror = "2.0.19"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = "0.7.19"
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = [
    "socket",
] }

[dev-dependencies]
tproxy-config = { version = "^7.0.7", default-features = false }

# [profile.release]
# strip = "symbols"
