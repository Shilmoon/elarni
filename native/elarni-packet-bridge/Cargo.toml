[package]
name = "elarni-packet-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
tokio = { version = "=1.54.1", features = ["io-util", "rt-multi-thread", "sync", "time"] }
tun2proxy = { path = "../../Vendor/tun2proxy", default-features = false }

[dev-dependencies]
socket2 = "=0.6.5"
