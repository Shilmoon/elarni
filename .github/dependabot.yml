version: 2
# Monthly, one grouped pull request per ecosystem; security updates still arrive as soon as they are published.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ['*']
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    groups:
      pub:
        patterns: ['*']
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
  # The Go forks follow upstream Xray-core and libXray: security updates only.
  - package-ecosystem: gomod
    directories: [/Vendor/Xray-core, /Vendor/libXray]
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
