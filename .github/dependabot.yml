version: 2
# One monthly pull request for every ecosystem: each run of the checks occupies the single self-hosted Linux runner
# and Windows VM, so five separate pull requests queued for an hour. Security updates still arrive as soon as they
# are published, and are not delayed by the cooldown.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
updates:
  # Version updates wait a week after release.
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: pub
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    ignore:
      # Pinned country names: 2.2.0 renamed Nauru to "Naoero" in English. Update by hand and regenerate
      # android/app/src/main/assets/server-locations.json (scripts/export-android-locations.dart).
      - dependency-name: l10n_countries
  - package-ecosystem: gradle
    directory: /android
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
  # The Go forks follow upstream Xray-core and libXray: security updates only.
  - package-ecosystem: gomod
    directories: [/Vendor/Xray-core, /Vendor/libXray]
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
