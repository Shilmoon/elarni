name: Dependabot auto-merge

# Patch-only Dependabot pull requests merge on their own once the checks that the main ruleset
# requires pass; minor and major updates (and groups containing one) wait for a maintainer.
on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Shilmoon/elarni'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge
        # update-type is the highest semver change in the pull request.
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
