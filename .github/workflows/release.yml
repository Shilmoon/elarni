name: Release

# Release files come from GitHub-hosted runners with no cache from earlier builds, never from the self-hosted
# runners that also run pull request code. See docs/RELEASING.md for the whole flow:
#   build    the unsigned packages, source archives and APK of the selected commit, with build provenance
#   publish  after the release machine has signed the APK and uploaded a draft: checks the draft's files against
#            the provenance, signs SHA256SUMS and publishes the release
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [build, publish]
        default: build
      tag:
        description: Draft release tag to publish, such as v0.4.1 (publish only)
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    name: linux and android
    if: inputs.stage == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space for the container's toolchains
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The container fetches the commit from this checkout, which a shallow clone cannot always serve.
          fetch-depth: 0
      - name: Build the Linux packages, source archives and unsigned APK
        # The Ubuntu 22.04 container of the checks (glibc 2.35), built from scratch on this runner.
        run: |
          python3 scripts/check-linux-container -- bash -c '
            set -e
            flutter build linux --release --target=lib/main.dart
            rm -rf .build/release-candidate .build/release-source .build/release-dependencies .build/android-release
            python scripts/package-linux --output .build/release-candidate
            python scripts/package-source --output .build/release-source
            python scripts/package-dependencies --output .build/release-dependencies
            python scripts/prepare-android-linux
            python scripts/build-android-native
            android/gradlew -p android :app:assembleRelease --no-daemon --console=plain
            mkdir -p .build/android-release && cp android/app/build/outputs/apk/release/*.apk .build/android-release/
            cp -r .build/release-candidate .build/release-source .build/release-dependencies .build/android-release /out/'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-candidate-linux
          path: |
            .build/check-results/release-candidate/
            .build/check-results/release-source/
            .build/check-results/release-dependencies/
            .build/check-results/android-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  windows:
    if: inputs.stage == 'build'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.8
          cache: false
      - name: Install the Rust toolchain selected by the repository
        run: rustup show
      - name: Install WiX Toolset v5
        run: |
          dotnet tool update --global wix --version 5.0.2
          echo "$USERPROFILE\\.dotnet\\tools" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter build windows --release --target=lib/main.dart
      - name: Package the unsigned ZIP and MSI
        run: python scripts/package-windows --bundle build/windows/x64/runner/Release --output .build/windows-release/release-candidate --unsigned --msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-candidate-windows-2022
          # The parent keeps release-candidate/ in the artifact; a lone directory's files land at its root.
          path: .build/windows-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  provenance:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-candidate-*
          path: dist
      - name: Check the packagers' checksums and list the release files
        id: files
        run: |
          set -e
          L=dist/unsigned-candidate-linux W=dist/unsigned-candidate-windows-2022
          for d in "$L/release-candidate" "$L/release-source" "$L/release-dependencies" "$W/release-candidate"; do
            (cd "$d" && tr -d '\r' < SHA256SUMS | sha256sum --quiet -c -)
          done
          deb=$(basename "$L"/release-candidate/elarni_*_amd64.deb)
          echo "version=$(echo "$deb" | sed 's/^elarni_\(.*\)_amd64\.deb$/\1/')" >> "$GITHUB_OUTPUT"
          {
            echo 'subjects<<EOF'
            ls "$L"/release-candidate/*.deb "$L"/release-candidate/*.AppImage "$L"/release-candidate/*.tar.gz \
               "$W"/release-candidate/*.msi "$W"/release-candidate/*.zip "$L"/release-source/*-project-source.tar.gz \
               "$L"/release-dependencies/elarni-go-module-sources.tar.gz "$L"/android-release/*.apk
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.subjects }}
      # Published next to the files, so the provenance travels with the release (gh attestation verify reads it
      # from GitHub without this copy).
      - run: mkdir provenance && cp "$BUNDLE" "provenance/Elarni-$VERSION.intoto.jsonl"
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ steps.files.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-candidate-provenance
          path: provenance/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: inputs.stage == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download the draft
        run: |
          set -e
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release download "$TAG" --dir dist
      - name: Check the files against SHA256SUMS and the build provenance
        working-directory: dist
        # The signed APK differs from the attested unsigned one by its signature, so it is checked by checksum only.
        run: |
          set -e
          sha256sum --quiet -c SHA256SUMS
          for file in *; do
            case "$file" in SHA256SUMS|*.apk|*.intoto.jsonl|*.sigstore.json) continue ;; esac
            gh attestation verify "$file" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml" > /dev/null
            echo "attested: $file"
          done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS
        # Keyless: the signature names this workflow; check it with cosign verify-blob (docs/RELEASING.md).
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Publish
        # Immutable releases lock the tag and the files once the draft is published.
        run: |
          gh release upload "$TAG" dist/SHA256SUMS.sigstore.json
          gh release edit "$TAG" --draft=false --latest
