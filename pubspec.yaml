name: elarni
description: "Elarni secure routing client."
publish_to: 'none'
version: 0.6.1+16

environment:
  sdk: '>=3.12.2 <3.13.0'

dependencies:
  country_flags: 4.1.2
  crypto: 3.0.7
  cupertino_icons: ^2.0.0
  ffi: 2.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  l10n_countries: 2.0.3

dev_dependencies:
  ffigen: 21.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/elarni-app-icon.png
